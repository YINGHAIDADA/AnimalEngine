<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Animal Engine</title>
  <desc id="hero-desc">为像素风二维探索准备的 C++20 引擎，附带一座可以玩通的洞穴。画布锁在 320×180，窗口按整数倍放大，边缘留黑。右侧画布示意里有藤蔓、吊灯、水晶、水面和一只白兔。固定输入时 OpenGL 4.1 与 Vulkan 1.2 逐像素相同。</desc>
  <defs>
    <clipPath id="canvas-clip">
      <rect width="452" height="254"/>
    </clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="18" fill="#161822" stroke="#343A4E" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif">
