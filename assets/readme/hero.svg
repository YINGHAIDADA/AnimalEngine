      <rect width="28" height="18" rx="2" fill="#07080C"/>
      <rect x="4" y="4" width="20" height="10" fill="#24324C"/>
      <rect x="12" y="6" width="4" height="4" fill="#7ADFFF"/>
      <text x="40" y="14" fill="#B4B6C4" font-size="18">C++20 · 像素2D引擎 · 流体模拟</text>
    </g>
    <text x="60" y="164" fill="#F6F3EA" font-size="64" font-weight="700">Animal Engine</text>
    <text x="60" y="220" fill="#E6E2D6" font-size="26">将复杂光照带入2D像素游戏</text>
    <text x="60" y="256" fill="#E6E2D6" font-size="26">并支持流体模拟</text>
    <text x="60" y="304" fill="#B4B6C4" font-size="22">十个房间的demo地图，演示引擎能力</text>
    <g id="title-menu" transform="translate(60 344)" font-size="20">
